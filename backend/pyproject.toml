[project]
name = "bright-spots-backend"
version = "0.1.0"
description = "Bright Spots API: live land check-ups from NASA satellite data"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "rasterio>=1.4.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "respx>=0.23.1",
    "pytest-asyncio>=1.5.0",
]
prep = [
    "netcdf4>=1.7.5.1.post1",
    "xarray>=2026.9.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "pymannkendall>=1.4",
    "statsmodels>=0.14",
    "requests>=2.32",
    "geopandas>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
default-groups = ["dev", "prep"]
